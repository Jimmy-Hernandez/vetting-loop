<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 458" width="1280" height="458" role="img" aria-label="Pattern signal match counts" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Pattern signal match counts</title><rect width="1280" height="458" fill="#fff"/><text x="40" y="40" font-size="13" fill="#bd1419" font-weight="800" text-anchor="start" letter-spacing="1.5">FIG-03 · PATTERN SIGNALS: MATCHES IN THE CURRENT LEDGER</text><text x="40" y="62" font-size="13" fill="#6b6b6b" font-weight="400" text-anchor="start" >Deterministic rules over public facts. They describe the appointment process, never a person's conduct.</text><text x="40" y="112" font-size="15" fill="#333333" font-weight="700" text-anchor="start" >Rejected at the gate</text><rect x="360" y="96" width="660" height="24" rx="4" fill="#f8f8f8"/><rect x="360" y="96" width="128.0" height="24" rx="4" fill="#008033"/><text x="1040" y="114" font-size="16" fill="#333333" font-weight="800" text-anchor="start" >2</text><text x="40" y="158" font-size="15" fill="#333333" font-weight="700" text-anchor="start" >Returned after dissolution</text><rect x="360" y="142" width="660" height="24" rx="4" fill="#f8f8f8"/><rect x="360" y="142" width="640.0" height="24" rx="4" fill="#b45309"/><text x="1040" y="160" font-size="16" fill="#333333" font-weight="800" text-anchor="start" >10</text><text x="40" y="204" font-size="15" fill="#333333" font-weight="700" text-anchor="start" >Docket rotation</text><rect x="360" y="188" width="660" height="24" rx="4" fill="#f8f8f8"/><rect x="360" y="188" width="640.0" height="24" rx="4" fill="#b45309"/><text x="1040" y="206" font-size="16" fill="#333333" font-weight="800" text-anchor="start" >10</text><text x="40" y="250" font-size="15" fill="#333333" font-weight="700" text-anchor="start" >Soft landing</text><rect x="360" y="234" width="660" height="24" rx="4" fill="#f8f8f8"/><rect x="360" y="234" width="192.0" height="24" rx="4" fill="#b45309"/><text x="1040" y="252" font-size="16" fill="#333333" font-weight="800" text-anchor="start" >3</text><text x="40" y="296" font-size="15" fill="#333333" font-weight="700" text-anchor="start" >Committee overruled</text><rect x="360" y="280" width="660" height="24" rx="4" fill="#f8f8f8"/><rect x="360" y="280" width="64.0" height="24" rx="4" fill="#bd1419"/><text x="1040" y="298" font-size="16" fill="#333333" font-weight="800" text-anchor="start" >1</text><text x="40" y="342" font-size="15" fill="#333333" font-weight="700" text-anchor="start" >Gazetted without approval</text><rect x="360" y="326" width="660" height="24" rx="4" fill="#f8f8f8"/><rect x="360" y="326" width="64.0" height="24" rx="4" fill="#bd1419"/><text x="1040" y="344" font-size="16" fill="#333333" font-weight="800" text-anchor="start" >1</text><text x="40" y="388" font-size="15" fill="#333333" font-weight="700" text-anchor="start" >Declined nomination</text><rect x="360" y="372" width="660" height="24" rx="4" fill="#f8f8f8"/><rect x="360" y="372" width="128.0" height="24" rx="4" fill="#475569"/><text x="1040" y="390" font-size="16" fill="#333333" font-weight="800" text-anchor="start" >2</text><text x="40" y="434" font-size="15" fill="#333333" font-weight="700" text-anchor="start" >Elevated without a hearing</text><rect x="360" y="418" width="660" height="24" rx="4" fill="#f8f8f8"/><rect x="360" y="418" width="64.0" height="24" rx="4" fill="#bd1419"/><text x="1040" y="436" font-size="16" fill="#333333" font-weight="800" text-anchor="start" >1</text></svg>
