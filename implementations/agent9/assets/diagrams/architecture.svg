<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 620" width="1280" height="620" role="img" aria-label="System architecture: sources, ledger, static site, sealed tip line, resilience layer" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif"><title>System architecture: sources, ledger, static site, sealed tip line, resilience layer</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker></defs><rect width="1280" height="620" fill="#fff"/><text x="40" y="44" font-size="13" fill="#bd1419" font-weight="800" text-anchor="start" letter-spacing="1.5">FIG-01 · SYSTEM ARCHITECTURE</text><text x="40" y="66" font-size="13" fill="#6b6b6b" font-weight="400" text-anchor="start" >Live on Cloudflare Pages. Everything left of the edge is computed at build time.</text><rect x="40" y="100" width="230" height="150" rx="6" fill="#fff" stroke="#e3e3e3"/><rect x="40" y="100" width="230" height="5" rx="2" fill="#6b6b6b"/><text x="56" y="130" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >Public sources</text><text x="56" y="152" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Kenya Gazette notices</text><text x="56" y="171" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Hansard, committee reports</text><text x="56" y="190" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Dated press (cross-check)</text><text x="56" y="209" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Verification tier per record</text><rect x="330" y="100" width="270" height="150" rx="6" fill="#fff" stroke="#e3e3e3"/><rect x="330" y="100" width="270" height="5" rx="2" fill="#bd1419"/><text x="346" y="130" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >packages/ledger</text><text x="346" y="152" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >93 people · 111 appointments</text><text x="346" y="171" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >8 deterministic signal rules</text><text x="346" y="190" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >sha256 per record + root</text><text x="346" y="209" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >NIP-01 kind-30078 export</text><rect x="660" y="100" width="250" height="150" rx="6" fill="#fff" stroke="#e3e3e3"/><rect x="660" y="100" width="250" height="5" rx="2" fill="#bd1419"/><text x="676" y="130" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >apps/web (Next.js 14)</text><text x="676" y="152" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Static export: 129 pages</text><text x="676" y="171" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Ledger, signals, gate, records</text><text x="676" y="190" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Client-side filter only</text><text x="676" y="209" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Browser-side tip sealing</text><rect x="970" y="100" width="270" height="150" rx="6" fill="#fff" stroke="#e3e3e3"/><rect x="970" y="100" width="270" height="5" rx="2" fill="#008033"/><text x="986" y="130" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >Cloudflare Pages</text><text x="986" y="152" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Global CDN, static files</text><text x="986" y="171" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >CSP, no-referrer, noindex</text><text x="986" y="190" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >No cookies, no analytics</text><text x="986" y="209" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >vetting-record.pages.dev</text><path d="M270 175L328 175" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a)"/><path d="M600 175L658 175" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a)"/><text x="629.0" y="168.0" font-size="11" fill="#6b6b6b" font-weight="700" text-anchor="middle" >build</text><path d="M910 175L968 175" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a)"/><text x="939.0" y="168.0" font-size="11" fill="#6b6b6b" font-weight="700" text-anchor="middle" >deploy</text><rect x="970" y="320" width="270" height="130" rx="6" fill="#fff" stroke="#e3e3e3"/><rect x="970" y="320" width="270" height="5" rx="2" fill="#008033"/><text x="986" y="350" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >Pages Function /api/tips</text><text x="986" y="372" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Accepts sealed boxes only</text><text x="986" y="391" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Random receipt, 180-day TTL</text><text x="986" y="410" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Rate limit: sha256(IP+daily salt)</text><rect x="970" y="480" width="270" height="100" rx="6" fill="#f8f8f8" stroke="#e3e3e3"/><text x="986" y="510" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >KV: vetting-record-tips</text><text x="986" y="532" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Ciphertext + month + status</text><text x="986" y="551" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >No IP, no plaintext</text><path d="M1105 250L1105 318" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a)"/><path d="M1105 450L1105 478" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a)"/><rect x="660" y="320" width="250" height="130" rx="6" fill="#fff" stroke="#e3e3e3"/><rect x="660" y="320" width="250" height="5" rx="2" fill="#bd1419"/><text x="676" y="350" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >Reporter's browser</text><text x="676" y="372" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >ECDH P-256 ephemeral key</text><text x="676" y="391" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >HKDF-SHA256 → AES-256-GCM</text><text x="676" y="410" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Encrypts before sending</text><path d="M910 385L968 385" stroke="#6b6b6b" stroke-width="2" marker-end="url(#a)"/><text x="939.0" y="378.0" font-size="11" fill="#6b6b6b" font-weight="700" text-anchor="middle" >sealed</text><rect x="660" y="480" width="250" height="100" rx="6" fill="#f8f8f8" stroke="#e3e3e3"/><rect x="660" y="480" width="250" height="5" rx="2" fill="#8d1820"/><text x="676" y="510" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >Reviewer (offline)</text><text x="676" y="532" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Holds private key</text><text x="676" y="551" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >scripts/open-tips.mts</text><path d="M968 530L912 530" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="940.0" y="523.0" font-size="11" fill="#6b6b6b" font-weight="700" text-anchor="middle" >fetch</text><rect x="40" y="320" width="560" height="260" rx="6" fill="#fff" stroke="#e3e3e3"/><rect x="40" y="320" width="560" height="5" rx="2" fill="#008033"/><text x="56" y="350" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >Resilience layer</text><rect x="60" y="370" width="250" height="90" rx="6" fill="#f8f8f8" stroke="#e3e3e3"/><text x="76" y="400" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >data/*.json</text><text x="76" y="422" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >ledger · manifest · nostr-events</text><text x="76" y="441" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >CORS open, any mirror</text><rect x="330" y="370" width="250" height="90" rx="6" fill="#f8f8f8" stroke="#e3e3e3"/><text x="346" y="400" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >Nostr relays (ready)</text><text x="346" y="422" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Signed offline, --publish gate</text><text x="346" y="441" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >Addressable, replaceable</text><rect x="60" y="475" width="520" height="85" rx="6" fill="#fff" stroke="#e3e3e3"/><text x="76" y="505" font-size="15" fill="#333333" font-weight="800" text-anchor="start" >verify.ts: recompute every hash from any mirror</text><text x="76" y="527" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >root a23f1f0307e4d7d5a0d03a16d1ac6171bdab2f8f…</text><text x="76" y="546" font-size="12.5" fill="#6b6b6b" font-weight="400" text-anchor="start" >One edited word in one record → FAIL, names the record</text><path d="M470 250L330 368" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/></svg>
