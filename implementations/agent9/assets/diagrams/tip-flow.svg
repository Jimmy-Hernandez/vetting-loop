<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="Sealed tip flow from browser to offline reviewer" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Sealed tip flow from browser to offline reviewer</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6b6b6b"/></marker></defs><rect width="1280" height="460" fill="#fff"/><text x="40" y="40" font-size="13" fill="#bd1419" font-weight="800" text-anchor="start" letter-spacing="1.5">FIG-02 · SEALED TIP FLOW</text><rect x="20" y="62" width="220" height="40" rx="6" fill="#bd1419"/><text x="130" y="88" font-size="14" fill="#fff" font-weight="800" text-anchor="middle" >Reporter's browser</text><path d="M130 102V440" stroke="#e3e3e3" stroke-width="2" stroke-dasharray="4 4"/><rect x="530" y="62" width="220" height="40" rx="6" fill="#008033"/><text x="640" y="88" font-size="14" fill="#fff" font-weight="800" text-anchor="middle" >Pages Function + KV</text><path d="M640 102V440" stroke="#e3e3e3" stroke-width="2" stroke-dasharray="4 4"/><rect x="1010" y="62" width="220" height="40" rx="6" fill="#8d1820"/><text x="1120" y="88" font-size="14" fill="#fff" font-weight="800" text-anchor="middle" >Reviewer, offline</text><path d="M1120 102V440" stroke="#e3e3e3" stroke-width="2" stroke-dasharray="4 4"/><text x="144" y="134" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start" >1. generate ephemeral P-256 key pair</text><text x="144" y="158" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start" >2. ECDH with reviewer public key → HKDF-SHA256</text><text x="144" y="182" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start" >3. AES-256-GCM seal {record, message, links, contact}</text><path d="M132 214L636 214" stroke="#bd1419" stroke-width="2" marker-end="url(#a)"/><text x="384.0" y="207.0" font-size="11" fill="#bd1419" font-weight="700" text-anchor="middle" >POST {v, epk, iv, ct}: ciphertext only</text><text x="654" y="246" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start" >validate shape, rate-limit by salted hash</text><text x="654" y="268" font-size="12.5" fill="#333333" font-weight="400" text-anchor="start" >store tip:&lt;receipt&gt;, 180-day TTL, no IP</text><path d="M636 298L134 298" stroke="#008033" stroke-width="2" marker-end="url(#a)"/><text x="385.0" y="291.0" font-size="11" fill="#008033" font-weight="700" text-anchor="middle" >201 {receipt: VR-XXXX-XXXX-XXXX}</text><path d="M1116 336L646 336" stroke="#6b6b6b" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="881.0" y="329.0" font-size="11" fill="#6b6b6b" font-weight="700" text-anchor="middle" >later: list + get sealed boxes</text><text x="1106" y="370" font-size="12.5" fill="#333333" font-weight="400" text-anchor="end" >open with private key → plaintext</text><text x="1106" y="392" font-size="12.5" fill="#333333" font-weight="400" text-anchor="end" >verify independently before use</text><text x="1106" y="414" font-size="12.5" fill="#333333" font-weight="400" text-anchor="end" >facts enter the ledger with a public source</text></svg>
