<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 96" width="1280" height="96" role="img" aria-label="Section 00: Why this exists" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Section 00: Why this exists</title><rect width="1280" height="96" fill="#f8f8f8"/><rect width="8" height="96" fill="#bd1419"/><rect y="93" width="1280" height="3" fill="#e3e3e3"/><text x="40" y="58" font-size="34" fill="#bd1419" font-weight="800" text-anchor="start" >00</text><text x="112" y="50" font-size="26" fill="#333333" font-weight="800" text-anchor="start" >Why this exists</text><text x="113" y="74" font-size="14" fill="#6b6b6b" font-weight="400" text-anchor="start" >The vetting gate is Parliament's check on executive appointments. Nobody measures it.</text></svg>
