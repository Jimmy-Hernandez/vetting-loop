<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vetta — Vetting in Action · Mzalendo</title>
    <link rel="icon" type="image/png" href="/vetta-emblem.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
    <script>
      // HashRouter deep-link shim: /nominees -> /#/nominees etc. (legacy clean paths)
      (function () {
        var p = location.pathname.replace(/\/+$/, '');
        var map = { '/nominees': 1, '/vote': 1, '/methodology': 1, '/fallback': 1, '/about': 1, '/ledger': 1, '/signals': 1 };
        var m = p.match(/^\/nominee\/([a-z0-9-]+)$/);
        if (m) { location.replace('/#/nominee/' + m[1]); }
        else if (map[p]) { location.replace('/#' + p); }
      })();
    </script>
  </head>
  <body>
    <div id="root">(Question put and agreed to)</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
